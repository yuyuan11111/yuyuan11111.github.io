  <script id="site-search-data" type="application/json">[{"title":"从机器学习基础到 AI 实践：我想推荐的一本书","url":"/2026/08/09/AI%E5%AD%A6%E4%B9%A0%E4%B9%A6%E7%B1%8D%E5%88%86%E4%BA%AB/","type":"文章","text":"如果你正在学习 AI，或者已经会一些 Python，却总觉得机器学习的知识点有点散，我想推荐一本很适合慢慢读、慢慢做的书： 《Hands-On Machine Learning with Scikit-Learn, Keras, and TensorFlow》 中文里通常会把它称为《机器学习实战：基于 Scikit-Learn、Keras 和 TensorFlow》。它的作者是 Aurélien Géron。这本书最吸引我的地方，是它把“理解原理”和“动手实践”放在了同一条学习路径上。 为什么推荐它很多 AI 入门资料会在两个方向之间摇摆：要么讲很多数学概念，却很少真正写代码；要么很快搭出一个模型，却没有解释模型为什么有效。这本书的节奏相对平衡：先从监督学习、无监督学习、训练集和测试集等基础概念讲起，再逐渐过渡到神经网络、卷积神经网络、循环神经网络和更现代的深度学习方法。 它不会把 AI 描绘成一个只要调用接口就能完成的黑盒，而是会带着读者理解数据、模型、损失函数、优化和评估之间的关系。对我来说，这种“知道代码怎么写，也知道代码为什么这样写”的感觉很重要。 我从书里看到的学习路线1. 先把机器学习的基本问题讲清楚学习算法之前，需要先明确任务是什么：是在预测一个连续数值，还是判断一个类别？数据应该如何划分？模型的表现应该用什么指标衡量？这些问题看起来基础，却决定了后面很多选择。 书中从线性回归、逻辑回归、支持向量机、决策树和集成学习等内容展开，让人逐渐建立起对经典机器学习方法的整体认识。 2. 用完整流程理解一次建模真正做项目时，模型只是其中一部分。数据清洗、特征处理、交叉验证、超参数调整和误差分析，同样会影响最终结果。 我比较推荐边读边做书中的项目，尤其是从数据准备开始完整走一遍。这样可以把“数据进入模型，模型输出结果，结果再被评估”的流程连起来，而不是只记住几个算法名称。 3. 再进入深度学习在经典机器学习的基础上，书中继续介绍神经网络以及 Keras、TensorFlow 的使用。对刚接触深度学习的人来说，这部分能够帮助理解神经网络的基本组成，也能建立起训练、验证、保存和部署模型的实践感。 之后再去学习 CNN、RNN 或 Transformer 时，会更容易知道它们是在解决什么问题，而不是只把它们当成一串需要背下来的缩写。 这本书适合谁 有一些 Python 基础，想系统学习机器学习的人 看过零散课程，希望通过项目把知识串起来的人 想了解从数据处理到模型训练完整过程的人 已经接触深度学习，希望补一补经典机器学习基础的人 如果你还没有任何编程基础，直接从头读可能会稍微吃力。可以先补充 NumPy、Pandas 和 Matplotlib 的基本使用，再回到书里的项目，阅读体验会顺很多。 我的阅读建议我不太建议把它当成一本需要快速刷完的教材。更适合的方式是：每读完一个主题，就用自己的话写下“这个方法解决什么问题、它依赖什么假设、什么时候可能失效”，然后再亲手运行代码，观察数据和参数变化会带来什么结果。 还可以给每一章留下一个小问题，例如： 如果训练集表现很好，但测试集表现很差，我应该先检查数据、模型复杂度，还是重新调整评估方式？ 这种带着问题回看内容的方式，比单纯记笔记更容易形成自己的理解。 写在最后我推荐这本书，并不是因为它能让人读完就立刻成为 AI 专家，而是因为它提供了一条比较完整、也比较踏实的入口：从概念出发，用代码验证，再通过实验和分析逐步靠近问题本身。 对正在积累技术基础的我来说，学习 AI 不是一次性完成的任务，更像是在不断搭建自己的知识地图。希望这本书也能成为你地图里一个清晰的坐标。读到有收获的地方，记得停下来做一点属于自己的小实验，那里通常才是知识真正留下来的时刻。"},{"title":"芋圆的介绍","url":"/2026/04/10/%E8%8A%8B%E5%9C%86%E7%9A%84%E7%AC%AC%E4%B8%80%E7%AF%87Hexo%E5%8D%9A%E5%AE%A2/","type":"文章","text":"大家好，这里是芋圆的个人博客。 我希望它不只是一个放文章的地方，也是一间属于自己的小房间：可以写学习笔记，可以记录生活里的小事，也可以放一些慢慢变好的证据。 接下来我会继续完善这里的内容。也许会写技术学习中的难点总结，也许会写日常里那些不想忘记的片刻。希望未来回头看时，能看到自己一点点变清晰、变坚定、变闪亮。"},{"title":"我的第一篇 CCF-A 论文记录","url":"/2026/02/22/%E6%88%91%E7%9A%84%E7%AC%AC%E4%B8%80%E7%AF%87CCF-A%E8%AE%BA%E6%96%87%E8%AE%B0%E5%BD%95/","type":"文章","text":"2026 年 2 月 22 日，对我来说是一个很重要的时间点。 这一天，我的论文 Optimizing Charging Direction Set for Directional Mobile Chargers with Multi-Sectorial Energy Beams 正式被 IEEE Transactions on Mobile Computing 接收。这是 CCF-A 类、也是中科院一区期刊。对现在的我来说，这不仅仅是一篇论文，更像是我研究生阶段第一个真正留下来的科研结果，也是我科研路上的第一步。 论文原文： 点击查看 PDF 时间线 25-08 Submitted 25-11 Major Revision 26-01 Minor Revision 26-02 Accept 回头看这条时间线，其实每一步都不算轻松。从投稿到大修，再到小修和最终接收，中间有很多反复修改、补实验、调表达和打磨细节的过程。收到接收消息的时候，心里更多的是一种很安静的高兴：原来坚持做完一件科研上的事情，真的会留下痕迹。 这篇论文主要做了什么这篇工作关注的是 无线可充电传感器网络 中的移动充电问题。 传统研究里，很多工作默认移动充电器一次只能沿一个方向发射能量波束；但在更实际的硬件条件下，移动充电器其实可以同时形成多个扇形能量波束。这样虽然会带来更强的充电能力，但也引出了一个新的关键问题：怎样选择一组足够少、但又足够好用的充电方向，使得整体调度依然高效，而且能量损失尽可能低。 围绕这个问题，这篇论文主要做了两件事： 从理论上研究了多扇区波束移动充电器下的充电调度问题，并证明了这个问题是 NP-hard 的。 提出了一个用于方向选择的算法，以及一个四步式的充电调度框架，用来同时兼顾方向选择、充电时长分配和整体调度效率。 简单来说，这篇论文想解决的是：面对可以发出多个扇区波束的移动充电器，怎样更聪明地选方向、排调度，从而减少系统中的能量损失，并提升整体充电效率。 一个直观理解如果把移动充电器想象成一个可以“朝不同方向照射能量”的设备，那么它并不是方向越多越好。方向太多会让调度复杂、计算开销增大，也不一定真的带来更优结果。 所以这篇论文的核心思路，是在理论上找出一组“最小但足够用”的方向集合，让它在功能上尽可能等价于连续的完整方向空间。这样既能减少调度复杂度，也能为后续的充电时间分配和路径规划打下基础。 结果与意义论文中的实验结果表明，提出的方法相比已有基线方法，在能量效率和调度时间上都有明显提升。对我来说，更重要的是，这篇工作让我第一次完整经历了一个科研问题从提出、建模、设计算法、做实验、写论文，到修改和接收的全过程。 这也是我研究生阶段的第一个工作。 它可能不是我以后最成熟、最复杂的一篇论文，但一定会是我自己非常难忘的一篇。因为它提醒我，科研并不是一开始就要做得多么“厉害”，而是先迈出第一步，先把一个问题认真做完，然后再一点点走得更远。 以后回头看，我想我会记得这篇论文，不只是因为它发在了 IEEE TMC，更因为它是我真正开始科研的那个时刻。"},{"title":"MySQL 学习笔记","url":"/2024/09/10/MySQL%E5%AD%A6%E4%B9%A0%E7%AC%94%E8%AE%B0/","type":"文章","text":"这篇笔记主要用来整理 MySQL 学习中比较高频、也比较容易在面试里被问到的内容。很多知识点单独看都不难，但真正做题、写 SQL 或者回答面试题的时候，还是需要把它们放到一个完整框架里理解。 查询多表连接查询 内连接：只查出两张表的交集。 外连接：除了交集，还可以查出某一张表的全部数据。 通常更常用左外连接，因为右外连接很多时候只要调整表的位置就可以替代。 自连接自连接既可以做内连接，也可以做外连接，但一定要给表起别名。 一个典型例子是员工表和领导关系。员工表中的 manager_id，其实对应的就是同一张员工表中的 id，所以本质上是“同一张表和自己做关联”。 联合查询 union union 用来把多次查询结果合并成一个结果集。 参与联合的不同查询，字段个数和字段类型需要保持一致。 事务事务的四大特性 原子性：事务中的操作要么都成功，要么都失败。 一致性：事务执行前后，数据库都必须处于一致状态。 隔离性：并发事务之间互不干扰。 持久性：事务一旦提交，结果就会永久保存。 并发事务带来的问题 脏读：读到了另一个事务还没提交的数据。 不可重复读：同一事务中，两次读取同一条数据，结果不同。 幻读：同一事务中，两次按条件查询，第二次多出或少了一些“行”。 事务隔离级别事务隔离级别从低到高，隔离性越来越强，但性能通常会越来越低。 存储引擎InnoDB这是 MySQL 里最常用、也是大部分场景下默认的存储引擎。 特点： 支持事务 支持行级锁 支持外键 每张表通常对应一个 .ibd 文件 MyISAM特点： 不支持事务 不支持外键 支持表锁 访问速度快 对应文件一般包括 .MYD、.MYI、.sdi 适用场景： 读和插入操作为主 很少更新和删除 对事务完整性和高并发要求不高 Memory特点： 数据存储在内存中 只能作为临时表或缓存使用 支持 Hash 索引 一般只有 .sdi 文件保存结构信息 适用场景： 对速度要求高 数据量不能太大 适合临时性数据 面试高频：InnoDB 和 MyISAM 的区别最常见的回答角度： InnoDB 支持事务，MyISAM 不支持 InnoDB 支持行锁，MyISAM 主要是表锁 InnoDB 支持外键，MyISAM 不支持 InnoDB 更适合高并发和更新类业务，MyISAM 更偏向读多写少 索引索引本质上是帮助高效获取数据的一种数据结构。 常见索引结构 B+ 树索引：三种存储引擎都支持 Hash 索引：只有 Memory 支持 B 树和 B+ 树 B 树是多路平衡查找树。 B+ 树中，非叶子节点主要用于索引。 所有数据都存放在叶子节点中。 所有叶子节点会形成链表。 MySQL 的 B+ 树在叶子节点之间还增加了相邻指针，因此范围查询更高效。 索引分类聚集索引 只有一个 叶子节点下存放的是整行数据 一般由主键决定 如果没有主键，会选择第一个唯一索引 如果都没有，会生成隐藏主键 二级索引 可以有多个 叶子节点下存放的是主键值 查询非索引字段时，通常需要回表 索引性能分析常见分析手段： 查看 SQL 执行频次：重点优化高频 SQL 慢查询日志：定位执行时间过长的 SQL show profiles：查看 SQL 每一步的耗时 explain：分析执行计划，判断 SQL 是否用到了合适索引 索引使用规则最左前缀法则联合索引从最左边开始匹配，只有遵循最左前缀法则时，索引才更容易被有效利用。 范围查询范围查询右边的列通常会失效，所以尽量优先考虑 &gt;=、&lt;= 这类更有利于索引命中的写法。 索引失效的常见情况 不要在索引列上做运算，否则索引可能失效 字符串类型查询时必须加引号，否则可能失效 尾部模糊匹配可以利用索引，头部模糊匹配如 %abc 通常会失效 or 连接条件时，如果一边有索引一边没有，往往整体都不走索引 如果 MySQL 认为走索引还不如全表扫描，就可能放弃索引 更多索引知识前缀索引适用于长文本字段，目的是降低索引体积、提升效率。 前缀长度一般要结合选择性来决定： 选择性 = 不重复索引值数量 / 总记录数 选择性越高越好，唯一索引的选择性是 1，效果最好。 单列索引与联合索引 单列索引：一个索引只包含一个字段 联合索引：一个索引包含多个字段 如果查询条件经常是多列一起出现，通常更建议使用联合索引。这样不仅更容易满足最左前缀法则，也可能减少回表。 索引设计原则设计索引时，一般遵循几个思路： 给高频查询字段建索引 给区分度高的字段建索引 尽量使用联合索引替代多个重复的单列索引 索引不是越多越好，过多会影响插入、删除和更新性能 SQL 优化insert 优化 尽量批量插入 可以手动提交事务，减少频繁提交带来的开销 尽量按主键顺序插入 大批量导入时可以优先考虑 load 方式 主键优化 尽量降低主键长度 尽量使用顺序插入，减少页分裂 尽量不要用 UUID 作为主键 尽量避免修改主键 order by 优化尽量让排序过程走索引，理想情况下能看到 using index。 group by 优化 尽量建立合适索引 多字段分组时依然遵循最左前缀法则 limit 优化分页越往后，性能通常越差。一个常见优化方法是结合覆盖索引和子查询： 1234select *from tb_sku t, (select id from tb_sku order by id limit 200000, 10) awhere t.id = a.id; count 优化一般效率排序可以理解为： count(字段) &lt; count(主键id) &lt; count(1) ≈ count(*) 通常更推荐 count(*) 或 count(1)。 update 优化执行 update 时尽量根据主键或索引字段更新，否则很容易让原本应该加在行上的锁退化成更大范围的锁，影响并发。 锁全局锁一般用于做全库逻辑备份，锁定所有表，以保证数据完整性。 表级锁表锁 共享读锁：其他客户端只能读，不能写 独占写锁：其他客户端不能读也不能写 元数据锁由系统自动控制，主要是为了避免 DML 和 DDL 冲突，保证表结构和表数据操作的正确性。 当表上存在活动事务时，不允许随意修改元数据。 意向锁意向锁的作用是为了减少表锁和行锁冲突时的检查成本。 意向共享锁 IS：与表共享锁兼容，与表排他锁互斥 意向排他锁 IX：与表共享锁和排他锁都互斥 意向锁之间本身不会互斥。 行级锁行锁 锁定单条记录 防止其他事务对这条记录做 update 或 delete 在 RC 和 RR 隔离级别下都支持 分为共享锁和排他锁 如果没有索引，原本应该加行锁的操作，很可能会退化成表锁。 间隙锁锁定索引记录之间的间隙，防止其他事务在这个间隙中插入数据，从而避免幻读。 主要在 RR 隔离级别下使用。 临键锁临键锁是行锁和间隙锁的组合，同时锁住记录本身以及前面的间隙。 InnoDB 事务原理redo logredo log 主要保证持久性。它会先记录对数据页的修改，之后再刷盘。 undo logundo log 主要保证原子性。它记录数据修改前的信息，用来回滚，也支撑 MVCC。 MVCCMVCC 是面试高频内容，本质上是通过多版本并发控制来提高并发能力，并配合锁一起保障事务隔离性。 一条记录中和 MVCC 相关的几个隐式字段包括： 最近修改事务 ID 回滚指针 隐藏主键（如果没有主键会自动生成） 这里要注意，max_trx_id 通常可以理解为当前事务 ID 加 1，因为事务 ID 是预分配的。 redo log + undo log 一起参与保障事务一致性。 主从复制、分库分表、读写分离主从复制主从复制的底层原理是基于数据库的二进制日志 binlog。 分库分表单数据库在发展到一定规模后，容易出现： IO 瓶颈 CPU 瓶颈 分库分表的核心思路是把数据分散存储，从而分担数据库压力。 读写分离读写分离就是把数据库的读操作和写操作分配给不同服务器： 主库负责写 从库负责读 像 MyCat 这样的中间件可以比较方便地实现这一点。 一主一从与双主双从一主一从可以工作，但主库一旦宕机，就无法继续写入。所以为了提升可用性，很多时候还需要进一步采用双主双从这样的结构。 学习时容易被问到的高频点最后简单总结一下，MySQL 面试里很高频的内容通常集中在这些方面： InnoDB 和 MyISAM 的区别 聚集索引和二级索引的区别 B+ 树为什么适合数据库索引 最左前缀法则 索引失效场景 事务四大特性 脏读、不可重复读、幻读 MVCC 原理 行锁、间隙锁、临键锁的区别 这些内容如果能从“定义 + 应用场景 + 为什么这样设计”三个角度去理解，记忆会更牢，也更容易在面试中表达清楚。"},{"title":"个人","url":"/about/index.html","type":"页面","text":"Hi，我是芋圆这是一个还在生长中的个人博客。我想把它慢慢变成一个漂亮、安静、但有自己性格的小空间。 博客关键词 记录生活 学习成长 温柔审美 自由表达 后面可以继续补充个人介绍、技能树、时间线、愿望清单和年度总结。"},{"title":"休闲","url":"/leisure/index.html","type":"页面","text":"我的休闲清单 电影、音乐、剧集和书 周末出门拍到的风景 手账、穿搭、甜品和心情碎片 这个页面可以以后做成更轻松的生活相册，也可以放一些不那么正式的小随笔。"},{"title":"社交","url":"/social/index.html","type":"页面","text":"找到我 GitHub: yuyuan11111 Email: gao_qingyu@qq.com 欢迎温柔交流。这里暂时先放基础信息，后面可以补小红书、微博、B 站或其他社交平台。 书籍分享最近想推荐一本学习 AI 时很适合放在手边的书： 《Hands-On Machine Learning with Scikit-Learn, Keras, and TensorFlow》 它把机器学习的基本概念、经典算法、数据处理和深度学习实践串在了一起，适合已经有一点 Python 基础、想通过项目真正理解模型如何工作的读者。我很喜欢它的一点是：不会只停留在公式，也不会只给出可以运行的代码，而是会不断解释“为什么这样做”。 阅读我的书籍分享：从机器学习基础到 AI 实践"}]</script>
