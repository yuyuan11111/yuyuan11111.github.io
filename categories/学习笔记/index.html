  <script id="site-search-data" type="application/json">[{"title":"从场景路由到可控交付：咨询 PPT AI Skill 的设计实践","url":"/2026/07/25/%E5%92%A8%E8%AF%A2PPT-AI-Skill%E8%B7%AF%E7%94%B1%E8%AE%BE%E8%AE%A1/","type":"文章","text":"本文记录我在和君咨询 AI Agent 开发实习中的一个实践方向。为保护项目与客户信息，文中仅分享通用的技术设计、场景抽象和工程方法，不包含任何客户名称、业务数据或内部材料。 从“生成一页 PPT”到“交付一页可用的咨询表达”咨询场景里的 PPT，难点从来不只是把文字和图表放到一页上。 同样是一页“行业分析”，可能需要展示全球供需平衡、项目投资强度、企业盈利能力、汇率变化或产业链流向。每种内容都有不同的结构、数据口径和表达重点：供给、需求与缺口必须同口径；投资强度不能把矿山、冶炼和一体化项目混在一起；产业链图既要关系正确，也要避免连线穿过文字。 因此，我在实习中参与开发的不是一个只靠通用提示词生成幻灯片的工具，而是一套面向复杂 PPT 场景的 AI Skill。它把不同类型的咨询表达拆成可识别、可约束、可校验的路由，让模型在生成前先判断“这是什么页面”，再按该页面的规则组织数据、版式和结论。 我负责拆解的能力：9 类场景路由目前 Skill 已覆盖 9 类常见的复杂页面。它们不是简单按“折线图、柱状图”分类，而是按咨询分析任务来划分。 路由 解决的问题 核心约束 complex_chart_text 左图右文、左表右文与多指标解读 图表事实与右侧结论一一对应，只保留 3-5 个关键项 investment_intensity 单吨投资、CAPEX 强度与项目验证 明确项目边界，避免不同环节项目直接混算 global_supply_demand 全球供给、需求、平衡与缺口 统一单位、金属口径和预测年份，防止柱线与标签遮挡 segment_profitability 业务构成、营收、毛利率与估值比较 企业和业务组合拆行，缺失值不伪造为 0 usd_exchange 多货币汇率走势与变动比较 统一时间尺度，量级差异大的序列做指数化处理 price_review 全周期价格复盘与阶段判断 数据频率与分析范围匹配，没有证据时不编造原因 three_line_analysis CPI、PPI、PMI 等三图同页分析 使用共同时间区间，统一日期刻度和坐标位置 trade_structure 贸易流向、国别结构、Top10 与集中度 区分国别贸易和企业竞争，口径不完整时不计算集中度 industry_chain_map 上中下游、材料流向与回收闭环 只使用输入的节点和关系，严格控制连线和层级 这一步的价值，是把“模型自由发挥”的空间收窄为“在明确专业规则下完成表达”。对于企业场景，稳定性通常比一次惊艳的生成更重要。 核心设计：路由不是标签，而是一份可执行的页面契约我把每个路由都当作一份页面契约，而不是一个名称。一个完整契约至少包含四部分： 意图识别：根据用户描述判断页面目标，例如“全球供需”“单吨投资”或“产业链图谱”。 输入数据要求：明确必填字段、单位、时间范围、口径和来源。数据不够时先指出缺失项，而不是直接补一个看似合理的数字。 版式与图表规则：规定页面结构、图表类型、图例数量、文字密度、对齐关系和重点强调方式。 质量校验与降级策略：发现数据口径不一致、样本期过短或图表拥挤时，自动切换为更稳妥的表达方式。 用伪代码描述，就是把每一类页面从“提示词”升级为结构化配置： 1234567const route = &#123; name: &#x27;global_supply_demand&#x27;, requiredFields: [&#x27;year&#x27;, &#x27;supply&#x27;, &#x27;demand&#x27;, &#x27;unit&#x27;, &#x27;source&#x27;], validations: [&#x27;supply_and_demand_same_unit&#x27;, &#x27;forecast_year_labeled&#x27;], layoutRules: [&#x27;one_legend_per_metric&#x27;, &#x27;avoid_overlap_with_forecast_labels&#x27;], fallback: &#x27;show_supply_and_demand_trend_without_gap&#x27;&#125;; 这套结构让模型输出不再只依赖一段很长的自然语言提示，而是可以被程序检查、被其他路由复用，也能在出错时给出明确反馈。 我特别关注的三个工程问题1. 输入不完整时，先追问还是先生成真实业务里，用户经常只给一句“做一页全球供需”或一张来源不完整的表。直接生成，常常会出现单位混用、预测年份缺失、结论没有证据等问题。 我的处理思路是把字段分成“必须有”和“可以降级”。例如，全球供需页必须先有年份、供给、需求和单位；如果没有完整的平衡表，就不展示供需缺口，只生成供需趋势。价格复盘缺少事件材料时，只做数据观察，不写“由于某政策导致上涨”这类归因。 这本质上是在处理 Agent 的不确定性：宁可明确展示能力边界，也不让模型用幻觉补齐关键事实。 2. 图表能画出来，不代表页面能交付复杂 PPT 常见的失败不是“没有图”，而是图例重复、标签压住柱体、多张小图时间轴不一致、旧模板图表没有删除干净，或者右侧分析文字只是照抄模板。 因此，路由中需要把视觉约束写得足够具体。例如汇率页面要求多条小图统一左边界和时间尺度；供需页面只保留一套图例，并让预测标签避开柱体；复杂图表与文字对应页面限制右侧仅保留 3-5 项重点解释。对于需要修改的图表，目标是保留原生可编辑性，而不是输出一张静态图片。 3. 模板只能参考版式，不能成为内容来源产业链图谱是一个很典型的例子。参考页通常能提供阶段带、配色和连线结构，但其中原有的数字、行业和应用不能被带入新页面。否则看似版式正确，实际内容已经错了。 所以我把“参考页仅用于版式，不得保留原有数据和行业信息”作为显式规则，并约束模型只使用输入中的节点、关系、比例和回收路径。对生成式系统来说，这类内容隔离规则同样属于质量控制的一部分。 这段实践让我形成的 Agent 开发方法这次项目让我对 AI Agent 的理解更具体了一点：一个好的 Agent 不只是会调用模型，而是要把业务知识转换成系统能执行的约束。 我目前比较认可的开发路径是： 1用户需求 -&gt; 场景识别 -&gt; 路由选择 -&gt; 数据校验 -&gt; 页面生成 -&gt; 版式/事实检查 -&gt; 可编辑交付 其中最需要花时间的，往往不是最后一步“生成”，而是前面的场景拆分、字段定义、异常处理和验收标准。路由越清晰，后续迭代新场景、定位问题和复用能力就越容易。 写在最后我很喜欢这个项目的一点，是它让我看到 AI 在企业场景中的价值并不只是“替人写内容”。更重要的是，能否把人的专业判断、模板规范和交付标准沉淀为一套可以反复调用的能力。 这也是我接下来想持续探索的方向：让 Agent 不只会回答问题，而是能在明确的任务边界内，稳定地完成真实工作流。"},{"title":"从链式到树结构：我的 IEEE IoT Journal 多 UAV 协作卸载研究","url":"/2026/07/18/IOTJ%E8%AE%BA%E6%96%87%E8%AE%B0%E5%BD%95/","type":"文章","text":"这篇文章记录我参与的一项多 UAV 辅助移动边缘计算研究工作。论文题目为 Broker-mode Tree-structured Cooperative Offloading of Splittable Tasks for Dynamic Multi-UAV Assisted MEC Systems，目前发表于 IEEE Internet of Things Journal（IOTJ，中科院一区）。本文依据论文当前版本进行整理，重点介绍研究问题、核心方法和我对这项工作的理解。 论文信息： 论文题目：Broker-mode Tree-structured Cooperative Offloading of Splittable Tasks for Dynamic Multi-UAV Assisted MEC Systems 期刊：IEEE Internet of Things Journal IEEE Article ID：11614822 DOI：10.1109&#x2F;JIOT.2026.3715166 作者：Zhenguo Gao，Wenhui Ye，Qingyu Gao，Zhufang Kuang，Shih-Hau Fang，Hsiao-Chun Wu 这项工作在解决什么问题移动终端产生的任务越来越复杂，例如视频分析、智能感知和实时决策。这些任务通常需要较多计算资源，而终端设备本身的算力和电量都有限。移动边缘计算（Mobile Edge Computing, MEC）的基本思路，就是把任务卸载到距离更近的边缘节点进行处理。 在没有完善地面基站的偏远区域，UAV 可以作为具有移动能力的空中边缘服务器，为地面终端提供计算服务。但当一个任务很大、单个 UAV 的计算资源不足时，如何让多个 UAV 协同完成任务，就成为一个更复杂的问题。 这篇论文关注的就是一个动态的多 UAV 辅助 MEC 系统：地面终端会移动，任务可以被拆分，多个 UAV 需要共同完成计算，同时还要考虑 UAV 的飞行位置、通信资源、计算资源和系统能耗。 为什么要从链式协作走向树结构协作已有的多 UAV 协作方式中，一类是由终端直接把不同子任务分发给多个 UAV。这样虽然可以并行计算，但终端需要同时处理多个 UAV 的通信、任务划分和结果回传，控制开销比较大。 另一类 broker-mode 方法会让一个 UAV 充当 broker。终端只需要把任务交给 broker，再由 broker 根据其他 UAV 的工作负载和资源情况安排协作。这种方式能够减少终端侧的交互压力，也更适合动态网络环境。 但如果 broker 只能把任务沿着一条路径转发，协作关系就会变成链式结构：broker 把一部分任务交给 UAV 1，UAV 1 再把剩余任务交给 UAV 2。这样的结构层次单一，能够参与协作的 UAV 数量和并行能力都受到限制。 本文提出的关键思路是：允许 broker 把一个可拆分任务同时分发给多个 UAV，并允许这些 UAV 继续拆分自己的子任务，形成递归的树结构协作。 这样一来，任务不再只能沿着一条链路逐级传递，而是可以在多个分支上并行计算。每个参与协作的 UAV 既可以处理自己收到的部分，也可以继续将子任务交给下一层 UAV。 图 1：论文系统模型示意图。地面终端、UAV、覆盖区域以及任务卸载、结果回传和 UAV 协作关系分别用不同箭头表示。图片整理自论文 Fig. 1。 Broker-mode 的工作流程可以把整个过程理解成下面几个步骤： 地面终端在移动过程中产生一个需要计算的任务。 系统根据终端位置、任务情况和 UAV 资源，决定任务是否在本地执行，或者卸载给某个 UAV。 接收任务的 UAV 成为该任务的 broker，判断自己能处理多少任务，并决定是否向其他 UAV 转发子任务。 其他 UAV 根据获得的子任务和自身资源继续本地计算，必要时还可以向下一层 UAV 转发。 不同分支并行执行，计算结果逐层回传并由 broker 进行整合。 论文中的协作结构不是固定拓扑。实际由优化过程决定哪些 UAV 参与、每个 UAV 分到多少任务，以及协作会展开到多少层。 图 2：broker-mode 树结构协作示意图。任务从地面终端卸载到 broker UAV 后，沿多个分支递归分发。图片整理自论文 Fig. 3。 论文联合优化了哪些变量这项工作的难点在于，系统中多个决策变量是相互耦合的，不能只单独优化其中一个： 任务卸载决策：任务是在终端本地计算，还是卸载到某个 UAV。 任务拆分与协作拓扑：哪些 UAV 参与协作，任务如何在树结构中分配和转发。 UAV 轨迹与部署位置：UAV 飞到哪里，直接影响覆盖范围、通信距离和飞行能耗。 通信资源分配：包括终端与 UAV、UAV 与 UAV 之间的通信过程。 计算资源分配：不同 UAV 为各个任务分配多少计算能力。 论文将这些内容统一放入 JOUMCC 问题中，目标是最小化系统的总能量消耗，同时提高任务成功完成的数量。由于变量之间存在强耦合，原问题是一个复杂的非凸优化问题。 BMUC 算法的基本思路为处理这个联合优化问题，论文提出了基于 Block Coordinate Descent（BCD）的 Multiple UAV Collaboration（BMUC）算法，并结合 Successive Convex Approximation（SCA）方法进行求解。 直观地说，BMUC 并不是试图一次性解决所有变量，而是把原问题拆成多个相互关联的子问题，在迭代过程中交替优化： 固定其他变量，优化任务卸载、任务分配和树结构协作关系。 在当前协作关系下，优化 UAV 的部署位置和飞行轨迹。 根据新的位置和拓扑，重新分配通信与计算资源。 循环更新各个子问题，直到目标函数收敛或达到停止条件。 SCA 的作用，是将其中难以直接求解的非凸部分，在当前迭代点附近转化为更容易处理的近似问题。这样可以在保留原问题主要结构的同时，逐步得到一个可行的优化结果。 实验结果说明了什么论文通过多组仿真实验，从系统能耗、任务完成情况、UAV 计算能力、任务计算时长和轨迹变化等角度进行了分析。 总体结果表明，BMUC 在能耗和成功完成任务数量两个指标上都优于对比方案。论文摘要中给出的代表性结果是：计算任务能耗降低超过 10%，任务完成率提升超过 9%。在不同参数设置下，BMUC 相较次优方案还呈现出约 10.1% 至 10.7% 的计算能耗下降，以及约 9.3% 以上的任务完成率提升。 这些结果背后的原因并不是单纯增加 UAV 数量，而是树结构允许系统根据任务规模和实时资源情况动态拓展协作分支： 高负载任务可以被多个 UAV 并行处理； broker 可以根据资源情况动态调整任务分配； UAV 轨迹和通信距离可以与任务卸载决策共同优化； 当单个 UAV 无法独立完成任务时，树结构能够减少任务失败的可能性。 我从这项工作中理解到的几个关键词可拆分任务并不是所有计算任务都能被任意拆开。只有当任务具有合理的可分解结构时，才适合在多个 UAV 之间进行分配。因此，任务拆分比例、子任务之间的关系和结果整合方式，都需要在模型中明确。 Broker-modeBroker 不只是一个中转节点。它需要承担任务接收、资源判断、子任务划分、协作关系建立和结果整合等工作。把这些职责集中在 broker 上，可以减少终端与多个 UAV 之间的直接交互。 树结构协作树结构的优势在于分支和递归。它突破了单链路协作的限制，但同时也带来了更复杂的拓扑管理、任务比例约束和结果回传开销。因此，树越大并不意味着一定越好，最终仍然需要由能耗、时延和任务完成情况共同决定。 联合优化UAV 的位置会影响通信，通信会影响卸载，卸载又会影响计算资源分配和任务是否能够按时完成。这些变量相互影响，正是这类问题难以直接求解的原因，也是 BCD 和 SCA 方法发挥作用的地方。 写在研究路上这项工作让我对移动边缘计算和多 UAV 协作有了更完整的认识。以前看到“任务卸载”时，可能会更关注一个公式或一个算法；真正把系统模型、协作拓扑、轨迹、资源和实验结果连起来之后，才会发现，科研问题往往不是把某一个局部做到最好，而是要在多个目标和约束之间找到可行的平衡。 对我来说，这也是一次从具体问题出发，经历系统建模、优化问题构造、算法设计和仿真验证的研究实践。它让我更清楚自己感兴趣的方向：无线网络、边缘智能、移动计算，以及如何让有限的设备资源支撑更复杂的智能任务。 未来还可以继续考虑更多现实因素，例如 UAV 电池容量、充电调度、通信不稳定、任务优先级，以及能耗、时延、可靠性和公平性之间的多目标权衡。这些问题也提醒我，一篇论文的结束，往往只是下一个研究问题的开始。"},{"title":"我的第一篇 CCF-A 论文记录","url":"/2026/02/22/%E6%88%91%E7%9A%84%E7%AC%AC%E4%B8%80%E7%AF%87CCF-A%E8%AE%BA%E6%96%87%E8%AE%B0%E5%BD%95/","type":"文章","text":"2026 年 2 月 22 日，对我来说是一个很重要的时间点。 这一天，我的论文 Optimizing Charging Direction Set for Directional Mobile Chargers with Multi-Sectorial Energy Beams 正式被 IEEE Transactions on Mobile Computing 接收。这是 CCF-A 类、也是中科院一区期刊。对现在的我来说，这不仅仅是一篇论文，更像是我研究生阶段第一个真正留下来的科研结果，也是我科研路上的第一步。 论文原文： 点击查看 PDF 时间线 25-08 Submitted 25-11 Major Revision 26-01 Minor Revision 26-02 Accept 回头看这条时间线，其实每一步都不算轻松。从投稿到大修，再到小修和最终接收，中间有很多反复修改、补实验、调表达和打磨细节的过程。收到接收消息的时候，心里更多的是一种很安静的高兴：原来坚持做完一件科研上的事情，真的会留下痕迹。 这篇论文主要做了什么这篇工作关注的是 无线可充电传感器网络 中的移动充电问题。 传统研究里，很多工作默认移动充电器一次只能沿一个方向发射能量波束；但在更实际的硬件条件下，移动充电器其实可以同时形成多个扇形能量波束。这样虽然会带来更强的充电能力，但也引出了一个新的关键问题：怎样选择一组足够少、但又足够好用的充电方向，使得整体调度依然高效，而且能量损失尽可能低。 围绕这个问题，这篇论文主要做了两件事： 从理论上研究了多扇区波束移动充电器下的充电调度问题，并证明了这个问题是 NP-hard 的。 提出了一个用于方向选择的算法，以及一个四步式的充电调度框架，用来同时兼顾方向选择、充电时长分配和整体调度效率。 简单来说，这篇论文想解决的是：面对可以发出多个扇区波束的移动充电器，怎样更聪明地选方向、排调度，从而减少系统中的能量损失，并提升整体充电效率。 一个直观理解如果把移动充电器想象成一个可以“朝不同方向照射能量”的设备，那么它并不是方向越多越好。方向太多会让调度复杂、计算开销增大，也不一定真的带来更优结果。 所以这篇论文的核心思路，是在理论上找出一组“最小但足够用”的方向集合，让它在功能上尽可能等价于连续的完整方向空间。这样既能减少调度复杂度，也能为后续的充电时间分配和路径规划打下基础。 结果与意义论文中的实验结果表明，提出的方法相比已有基线方法，在能量效率和调度时间上都有明显提升。对我来说，更重要的是，这篇工作让我第一次完整经历了一个科研问题从提出、建模、设计算法、做实验、写论文，到修改和接收的全过程。 这也是我研究生阶段的第一个工作。 它可能不是我以后最成熟、最复杂的一篇论文，但一定会是我自己非常难忘的一篇。因为它提醒我，科研并不是一开始就要做得多么“厉害”，而是先迈出第一步，先把一个问题认真做完，然后再一点点走得更远。 以后回头看，我想我会记得这篇论文，不只是因为它发在了 IEEE TMC，更因为它是我真正开始科研的那个时刻。"},{"title":"在人人都需要会一点 AI 的时代，先把基础弄明白","url":"/2025/08/01/AI%E5%AD%A6%E4%B9%A0%E4%B9%A6%E7%B1%8D%E5%88%86%E4%BA%AB/","type":"文章","text":"为什么现在想分享这本书这几年，AI 已经从一个听起来有些遥远的技术词，进入了很多人的学习和工作：查资料、整理会议内容、修改表达、写代码、做数据分析，甚至规划一天的安排，都可能用到 AI。 所以我觉得，“会一点 AI”会慢慢变成一种和搜索、办公软件类似的基础能力。但这里的“会”并不是把所有事情都交给工具，也不是会写几个提示词就够了。至少我们需要知道三件事：怎样把问题说清楚，怎样检查它给出的结果，以及哪些隐私和重要决定不能随便交出去。 在这个背景下，我想分享一本更偏基础、也更适合慢慢读的书：《Hands-On Machine Learning with Scikit-Learn, Keras, and TensorFlow》。中文通常译作《机器学习实战：基于 Scikit-Learn、Keras 和 TensorFlow》，作者是 Aurélien Géron。 这本书主要讲什么它不是一本提示词手册，也不是一本“几天学会大模型”的速成书。它关注的是机器学习和深度学习背后的基本方法，并通过 Python 项目把这些方法串起来。 书中会从监督学习、无监督学习、训练集和测试集讲起，再逐渐介绍线性模型、支持向量机、决策树、集成学习和神经网络。后面还会使用 Keras 和 TensorFlow 完成深度学习相关实践。 这种安排的价值在于，它不会只告诉我们“调用哪个接口”，而是会进一步追问： 数据应该怎样准备，才不会把错误带进模型？ 模型在训练集上表现很好，为什么换一批数据就不行了？ 怎样选择指标，才能比较真实地评价结果？ 神经网络到底是在学习什么，参数变化又意味着什么？ 这些问题和今天使用生成式 AI 也有联系。我们不一定每天都要训练模型，但理解数据、训练、评估和误差这些基本概念，会让我们更容易看懂 AI 的能力边界，也更容易发现一个答案是不是听起来很像真的、实际上却没有依据。 我觉得它适合什么样的读者如果你已经有一些 Python 基础，想系统了解机器学习，这本书可以作为一条比较完整的入门路线。它也适合上过一些零散课程，却总觉得知识点没有连起来的人。 如果你完全没有编程基础，直接读可能会有点吃力。可以先熟悉 NumPy、Pandas 和 Matplotlib，再配合书里的代码练习。读的时候也不必追求一次看完，先挑一个完整的小项目做下来，比匆匆记住很多术语更有用。 它不能替代什么这本书的优点是基础扎实、实践完整，但也要诚实地说，它并不是一本最新的生成式 AI 指南。书里的重点是经典机器学习和深度学习，关于 ChatGPT、大语言模型、提示工程和 AI 智能体的内容，需要另外参考更新的课程、论文和官方文档。 所以我更愿意把它看成一块地基：它不能直接告诉你今天某个 AI 产品的全部用法，却能帮助你理解许多产品背后共通的概念。地基不一定最热闹，但在面对新工具时，它会让人少一些“只会跟着教程点下一步”的不安。 在日常里怎样学得更实际我觉得学习 AI 不应该只停留在收藏资料。可以从身边一个真实的小问题开始，比如： 让 AI 帮忙整理一份学习计划，然后检查它是否了解自己的时间和目标。 让 AI 解释一个概念，再用教材或官方资料核对关键结论。 让 AI 协助修改一段文字，但自己保留对事实、语气和最终版本的判断。 尝试把一个重复的小任务拆成步骤，观察 AI 在哪一步容易出错。 这样做的重点不是让 AI 替我们完成所有事情，而是逐渐形成一种配合方式：把它当作可以讨论、可以协助的工具，同时保留自己的思考和复核。 写在最后在人人都需要会一点 AI 的时代，学习 AI 不一定意味着每个人都要成为算法工程师。对很多人来说，先理解一些基本原理，学会提出清楚的问题，知道如何验证答案、保护隐私，已经是很有价值的开始。 我推荐这本书，也是因为它没有把 AI 讲成一个神奇的黑盒。它提醒我，真正可靠的技术能力，往往来自对数据、方法和结果保持一点耐心。希望它能成为你了解 AI 的一个入口，也希望我们在使用新工具时，始终保留自己的判断力。"},{"title":"MySQL 学习笔记","url":"/2024/09/10/MySQL%E5%AD%A6%E4%B9%A0%E7%AC%94%E8%AE%B0/","type":"文章","text":"这篇笔记主要用来整理 MySQL 学习中比较高频、也比较容易在面试里被问到的内容。很多知识点单独看都不难，但真正做题、写 SQL 或者回答面试题的时候，还是需要把它们放到一个完整框架里理解。 查询多表连接查询 内连接：只查出两张表的交集。 外连接：除了交集，还可以查出某一张表的全部数据。 通常更常用左外连接，因为右外连接很多时候只要调整表的位置就可以替代。 自连接自连接既可以做内连接，也可以做外连接，但一定要给表起别名。 一个典型例子是员工表和领导关系。员工表中的 manager_id，其实对应的就是同一张员工表中的 id，所以本质上是“同一张表和自己做关联”。 联合查询 union union 用来把多次查询结果合并成一个结果集。 参与联合的不同查询，字段个数和字段类型需要保持一致。 事务事务的四大特性 原子性：事务中的操作要么都成功，要么都失败。 一致性：事务执行前后，数据库都必须处于一致状态。 隔离性：并发事务之间互不干扰。 持久性：事务一旦提交，结果就会永久保存。 并发事务带来的问题 脏读：读到了另一个事务还没提交的数据。 不可重复读：同一事务中，两次读取同一条数据，结果不同。 幻读：同一事务中，两次按条件查询，第二次多出或少了一些“行”。 事务隔离级别事务隔离级别从低到高，隔离性越来越强，但性能通常会越来越低。 存储引擎InnoDB这是 MySQL 里最常用、也是大部分场景下默认的存储引擎。 特点： 支持事务 支持行级锁 支持外键 每张表通常对应一个 .ibd 文件 MyISAM特点： 不支持事务 不支持外键 支持表锁 访问速度快 对应文件一般包括 .MYD、.MYI、.sdi 适用场景： 读和插入操作为主 很少更新和删除 对事务完整性和高并发要求不高 Memory特点： 数据存储在内存中 只能作为临时表或缓存使用 支持 Hash 索引 一般只有 .sdi 文件保存结构信息 适用场景： 对速度要求高 数据量不能太大 适合临时性数据 面试高频：InnoDB 和 MyISAM 的区别最常见的回答角度： InnoDB 支持事务，MyISAM 不支持 InnoDB 支持行锁，MyISAM 主要是表锁 InnoDB 支持外键，MyISAM 不支持 InnoDB 更适合高并发和更新类业务，MyISAM 更偏向读多写少 索引索引本质上是帮助高效获取数据的一种数据结构。 常见索引结构 B+ 树索引：三种存储引擎都支持 Hash 索引：只有 Memory 支持 B 树和 B+ 树 B 树是多路平衡查找树。 B+ 树中，非叶子节点主要用于索引。 所有数据都存放在叶子节点中。 所有叶子节点会形成链表。 MySQL 的 B+ 树在叶子节点之间还增加了相邻指针，因此范围查询更高效。 索引分类聚集索引 只有一个 叶子节点下存放的是整行数据 一般由主键决定 如果没有主键，会选择第一个唯一索引 如果都没有，会生成隐藏主键 二级索引 可以有多个 叶子节点下存放的是主键值 查询非索引字段时，通常需要回表 索引性能分析常见分析手段： 查看 SQL 执行频次：重点优化高频 SQL 慢查询日志：定位执行时间过长的 SQL show profiles：查看 SQL 每一步的耗时 explain：分析执行计划，判断 SQL 是否用到了合适索引 索引使用规则最左前缀法则联合索引从最左边开始匹配，只有遵循最左前缀法则时，索引才更容易被有效利用。 范围查询范围查询右边的列通常会失效，所以尽量优先考虑 &gt;=、&lt;= 这类更有利于索引命中的写法。 索引失效的常见情况 不要在索引列上做运算，否则索引可能失效 字符串类型查询时必须加引号，否则可能失效 尾部模糊匹配可以利用索引，头部模糊匹配如 %abc 通常会失效 or 连接条件时，如果一边有索引一边没有，往往整体都不走索引 如果 MySQL 认为走索引还不如全表扫描，就可能放弃索引 更多索引知识前缀索引适用于长文本字段，目的是降低索引体积、提升效率。 前缀长度一般要结合选择性来决定： 选择性 = 不重复索引值数量 / 总记录数 选择性越高越好，唯一索引的选择性是 1，效果最好。 单列索引与联合索引 单列索引：一个索引只包含一个字段 联合索引：一个索引包含多个字段 如果查询条件经常是多列一起出现，通常更建议使用联合索引。这样不仅更容易满足最左前缀法则，也可能减少回表。 索引设计原则设计索引时，一般遵循几个思路： 给高频查询字段建索引 给区分度高的字段建索引 尽量使用联合索引替代多个重复的单列索引 索引不是越多越好，过多会影响插入、删除和更新性能 SQL 优化insert 优化 尽量批量插入 可以手动提交事务，减少频繁提交带来的开销 尽量按主键顺序插入 大批量导入时可以优先考虑 load 方式 主键优化 尽量降低主键长度 尽量使用顺序插入，减少页分裂 尽量不要用 UUID 作为主键 尽量避免修改主键 order by 优化尽量让排序过程走索引，理想情况下能看到 using index。 group by 优化 尽量建立合适索引 多字段分组时依然遵循最左前缀法则 limit 优化分页越往后，性能通常越差。一个常见优化方法是结合覆盖索引和子查询： 1234select *from tb_sku t, (select id from tb_sku order by id limit 200000, 10) awhere t.id = a.id; count 优化一般效率排序可以理解为： count(字段) &lt; count(主键id) &lt; count(1) ≈ count(*) 通常更推荐 count(*) 或 count(1)。 update 优化执行 update 时尽量根据主键或索引字段更新，否则很容易让原本应该加在行上的锁退化成更大范围的锁，影响并发。 锁全局锁一般用于做全库逻辑备份，锁定所有表，以保证数据完整性。 表级锁表锁 共享读锁：其他客户端只能读，不能写 独占写锁：其他客户端不能读也不能写 元数据锁由系统自动控制，主要是为了避免 DML 和 DDL 冲突，保证表结构和表数据操作的正确性。 当表上存在活动事务时，不允许随意修改元数据。 意向锁意向锁的作用是为了减少表锁和行锁冲突时的检查成本。 意向共享锁 IS：与表共享锁兼容，与表排他锁互斥 意向排他锁 IX：与表共享锁和排他锁都互斥 意向锁之间本身不会互斥。 行级锁行锁 锁定单条记录 防止其他事务对这条记录做 update 或 delete 在 RC 和 RR 隔离级别下都支持 分为共享锁和排他锁 如果没有索引，原本应该加行锁的操作，很可能会退化成表锁。 间隙锁锁定索引记录之间的间隙，防止其他事务在这个间隙中插入数据，从而避免幻读。 主要在 RR 隔离级别下使用。 临键锁临键锁是行锁和间隙锁的组合，同时锁住记录本身以及前面的间隙。 InnoDB 事务原理redo logredo log 主要保证持久性。它会先记录对数据页的修改，之后再刷盘。 undo logundo log 主要保证原子性。它记录数据修改前的信息，用来回滚，也支撑 MVCC。 MVCCMVCC 是面试高频内容，本质上是通过多版本并发控制来提高并发能力，并配合锁一起保障事务隔离性。 一条记录中和 MVCC 相关的几个隐式字段包括： 最近修改事务 ID 回滚指针 隐藏主键（如果没有主键会自动生成） 这里要注意，max_trx_id 通常可以理解为当前事务 ID 加 1，因为事务 ID 是预分配的。 redo log + undo log 一起参与保障事务一致性。 主从复制、分库分表、读写分离主从复制主从复制的底层原理是基于数据库的二进制日志 binlog。 分库分表单数据库在发展到一定规模后，容易出现： IO 瓶颈 CPU 瓶颈 分库分表的核心思路是把数据分散存储，从而分担数据库压力。 读写分离读写分离就是把数据库的读操作和写操作分配给不同服务器： 主库负责写 从库负责读 像 MyCat 这样的中间件可以比较方便地实现这一点。 一主一从与双主双从一主一从可以工作，但主库一旦宕机，就无法继续写入。所以为了提升可用性，很多时候还需要进一步采用双主双从这样的结构。 学习时容易被问到的高频点最后简单总结一下，MySQL 面试里很高频的内容通常集中在这些方面： InnoDB 和 MyISAM 的区别 聚集索引和二级索引的区别 B+ 树为什么适合数据库索引 最左前缀法则 索引失效场景 事务四大特性 脏读、不可重复读、幻读 MVCC 原理 行锁、间隙锁、临键锁的区别 这些内容如果能从“定义 + 应用场景 + 为什么这样设计”三个角度去理解，记忆会更牢，也更容易在面试中表达清楚。"},{"title":"芋圆的介绍","url":"/2023/10/01/%E8%8A%8B%E5%9C%86%E7%9A%84%E7%AC%AC%E4%B8%80%E7%AF%87Hexo%E5%8D%9A%E5%AE%A2/","type":"文章","text":"大家好，这里是芋圆的个人博客。 我希望它不只是一个放文章的地方，也是一间属于自己的小房间：可以写学习笔记，可以记录生活里的小事，也可以放一些慢慢变好的证据。 接下来我会继续完善这里的内容。也许会写技术学习中的难点总结，也许会写日常里那些不想忘记的片刻。希望未来回头看时，能看到自己一点点变清晰、变坚定、变闪亮。"},{"title":"个人","url":"/about/index.html","type":"页面","text":"Hi，我是芋圆这是一个还在生长中的个人博客。我想把它慢慢变成一个漂亮、安静、但有自己性格的小空间。 博客关键词 记录生活 学习成长 温柔审美 自由表达 后面可以继续补充个人介绍、技能树、时间线、愿望清单和年度总结。"},{"title":"休闲","url":"/leisure/index.html","type":"页面","text":"我的休闲清单 电影、音乐、剧集和书 周末出门拍到的风景 手账、穿搭、甜品和心情碎片 书籍分享在人人都需要会一点 AI 的时代，先把基础弄明白现在的 AI 已经不只是研究室里的概念。写材料、查资料、整理信息、学习新知识时，我们都可能和它打交道。但“会用 AI”不等于把答案直接复制下来，更重要的是知道怎样描述问题、怎样判断结果、哪些信息不应该交给它。 我想推荐的书是 《Hands-On Machine Learning with Scikit-Learn, Keras, and TensorFlow》，中文通常译作《机器学习实战：基于 Scikit-Learn、Keras 和 TensorFlow》。它不是一本教人写提示词的书，也不是读完就能立刻做出大模型的捷径，而是用比较完整的案例，解释机器学习和深度学习到底是怎样工作的。 这本书更适合有一点 Python 基础、想从“会调用工具”继续走向“理解工具”的读者。它会涉及数据处理、模型训练、评估、过拟合，以及神经网络等内容。即使暂时不打算做 AI 研究，了解这些基本概念，也能帮助我们在使用 AI 时少一点盲目，多一点判断。 需要说明的是，这本书的重点是机器学习基础和深度学习实践，并不是最新的生成式 AI 使用手册。想了解 ChatGPT、智能体和大语言模型，还需要结合新的课程、官方文档和实际体验一起学习。对我来说，它更像是一块稳固的地基，而不是一份“跟着做就能掌握全部 AI”的答案。 阅读完整书籍分享：在人人都需要会一点 AI 的时代 这个页面以后也会继续放一些读过、正在读，或者值得慢慢聊的书。"},{"title":"社交","url":"/social/index.html","type":"页面","text":"找到我 GitHub: yuyuan11111 Email: gao_qingyu@qq.com 欢迎温柔交流。这里暂时先放基础信息，后面可以补小红书、微博、B 站或其他社交平台。"}]</script>
